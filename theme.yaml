# The galley theme: a blog in one reading column - the header, the
# lists, the text and the comments in one narrow column, serif type for
# reading, a wide cover over an article, the author under it, a sticky
# item at the top of a list with its picture across; an accent colour
# chosen on the Appearance page, a light and a dark scheme. It keeps the
# engine's regions, so blocks placed for another theme stay on the page:
# the one beside the content elsewhere (sidebar) is under it here.
name: Galley
# favicon - the theme's icon (the site's, uploaded on Site information,
# replaces it).
favicon: /static/themes/galley/images/galley-icon.svg
# The theme's description (Appearance page; entity.ThemeInfo).
description: A blog in one reading column - serif type, a wide cover over an article, the author and sharing under it, an accent colour, a light and a dark scheme.
author: Kosatka
license: MIT
# version - this release (the tag vX.Y.Z without its "v"); min_version -
# the oldest engine release the theme works with.
version: 0.1.0
min_version: 0.1.0
homepage: https://github.com/kosatka-cms/kosatka-theme-galley
tags: [light, dark, serif, blog, one-column, responsive]
screenshot: screenshot.jpg
# default_region - where new blocks go.
default_region: sidebar
regions:
  - id: header
    label: Header
  # Under the content, a block after another (partials/main_column.html).
  # The engine's ID: a site switching themes keeps its blocks here, and
  # the modules' blocks come here as to a sidebar.
  - id: sidebar
    label: Under the content
  # Between the page's title and its content.
  - id: content_top
    label: Content top
  - id: content_bottom
    label: Content bottom
  # Inside the node page (dynamic/page.html, forum/topic.html).
  - id: content_inline
    label: Inside content (content page)
  - id: footer
    label: Footer
  # The footer's last line (the copyright block on a new site).
  - id: footer_bottom
    label: Footer bottom line
# blocks - the blocks the theme comes with (entity.ThemeBlock): placed
# when the theme gets its layout for the first time, unless the layout
# has them.
blocks:
  - plugin: copyright
    region: footer_bottom
  - title: Powered by Kosatka CMS
    region: footer_bottom
    weight: 10
    body: |
      <p>Powered by <a href="https://github.com/kosatka-cms/kosatka">Kosatka CMS</a></p>
# settings - the theme's options on the Appearance page
# (entity.ThemeSetting). The accent and the font are attributes of
# <html> (partials/theme_head.html), galley.css has their colours.
settings:
  - id: accent
    label: Accent colour
    type: select
    default: rust
    options:
      - value: rust
        label: Rust
      - value: blue
        label: Blue
      - value: green
        label: Green
      - value: plum
        label: Plum
  - id: scheme
    label: Colour scheme by default
    type: select
    default: auto
    options:
      - value: auto
        label: As on the visitor's device
      - value: light
        label: Light
      - value: dark
        label: Dark
  - id: text_font
    label: The text's font
    type: select
    default: serif
    options:
      - value: serif
        label: Serif
      - value: sans
        label: Sans-serif
  - id: intro
    label: The front page's heading, over the list (the site's slogan when empty)
    type: text
    max_length: 300
  - id: share
    label: Sharing and the author under a text whose type shows the author and date
    type: bool
    default: true
  - id: guest_links
    label: Logging in and registration in the header
    type: bool
    default: false
