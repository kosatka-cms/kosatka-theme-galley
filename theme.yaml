# The galley theme: a blog set like a printed page - a reading column
# and a margin beside it. The text, the lists and the comments are in
# the column; the margin holds the sidebar's blocks as notes, and on a
# content page the byline, the other fields and the contents of a long
# text. The site's name as a wordmark in one row with the menu, rules
# instead of cards, Spectral for reading, small capitals for dates. An
# accent colour chosen on the Appearance page, a light and a dark
# scheme. On a phone the margin goes under the text. It keeps the
# engine's regions, so blocks placed for another theme stay on the page.
name: Galley
# favicon - the theme's icon (the site's, uploaded on Site information,
# replaces it).
favicon: /static/themes/galley/images/galley-icon.svg
# The theme's description (Appearance page; entity.ThemeInfo).
description: A blog set like a printed page - a reading column and a margin with the blocks, the byline and the contents, the site's name as a wordmark, rules instead of cards, an accent colour, a light and a dark scheme.
author: Kosatka
license: MIT
# version - this release (the tag vX.Y.Z without its "v"); min_version -
# the oldest engine release the theme works with.
version: 0.2.2
min_version: 0.1.6
homepage: https://github.com/kosatka-cms/kosatka-theme-galley
tags: [light, dark, serif, blog, typographic, responsive]
screenshot: screenshot.jpg
# default_region - where new blocks go.
default_region: sidebar
regions:
  - id: header
    label: Header
  # The margin beside the text (partials/main_column.html); under it on
  # a phone. The engine's ID: a site switching themes keeps its blocks
  # here, and the modules' blocks come here as to a sidebar.
  - id: sidebar
    label: Margin
  # Between the page's title and its content.
  - id: content_top
    label: Content top
  - id: content_bottom
    label: Content bottom
  # Inside the node page (dynamic/page.html, forum/topic.html).
  - id: content_inline
    label: Inside content (content page)
  - id: footer
    label: Footer
  # The footer's last line (the copyright block on a new site).
  - id: footer_bottom
    label: Footer bottom line
# blocks - the blocks the theme comes with (entity.ThemeBlock): placed
# when the theme gets its layout for the first time, unless the layout
# has them.
blocks:
  - plugin: copyright
    region: footer_bottom
  - title: Powered by Kosatka CMS
    region: footer_bottom
    weight: 10
    body: |
      <p>Powered by <a href="https://github.com/kosatka-cms/kosatka" target="_blank" rel="noopener">Kosatka CMS</a></p>
# settings - the theme's options on the Appearance page
# (entity.ThemeSetting). The accent, the font, the lists' pictures and
# the contents are attributes of <html> (partials/theme_head.html):
# galley.css and galley.js read them.
settings:
  - id: accent
    label: Accent colour
    type: select
    default: rust
    options:
      - value: rust
        label: Rust
      - value: blue
        label: Blue
      - value: green
        label: Green
      - value: plum
        label: Plum
  - id: scheme
    label: Colour scheme by default
    type: select
    default: auto
    options:
      - value: auto
        label: As on the visitor's device
      - value: light
        label: Light
      - value: dark
        label: Dark
  - id: text_font
    label: The text's font
    type: select
    default: serif
    options:
      - value: serif
        label: Serif
      - value: sans
        label: Sans-serif
  - id: list_pictures
    label: Pictures in lists
    type: select
    default: sticky
    options:
      - value: sticky
        label: The pinned item's only, across the column
      - value: all
        label: Every item's - the pinned one across, the others on the left
  - id: toc
    label: The contents of a text with three headings or more, in the margin
    type: bool
    default: true
  - id: intro
    label: The front page's heading, over the list (the site's slogan when empty)
    type: text
    max_length: 300
  - id: share
    label: Sharing and the author under a text whose type shows the author and date
    type: bool
    default: true
  - id: guest_links
    label: Logging in and registration in the header
    type: bool
    default: false
